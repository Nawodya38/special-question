<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I have a question...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Georgia', serif;
            /* Beautiful aesthetic soft peach-to-pink gradient background */
            background: linear-gradient(135deg, #ffccd5 0%, #ffdfba 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Falling Soft Red Hearts Background Effect */
        .heart-fall {
            position: absolute;
            color: #ff4d6d;
            opacity: 0.6;
            font-size: 22px;
            animation: fall linear infinite;
            pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .card {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.75); /* Frosted glass card layout */
            padding: 45px 35px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 85%;
        }

        /* Graphic Art Container Sizing */
        .graphic-container {
            width: 180px;
            height: 180px;
            margin-bottom: 25px;
        }

        /* Intro Page Elegant Heading Text */
        .intro-text {
            color: #ff4d6d;
            font-size: 2.3rem;
            line-height: 1.4;
            margin-bottom: 40px;
            font-weight: normal;
            font-family: 'Georgia', serif;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.1rem;
            margin-top: 0;
            margin-bottom: 35px;
            font-weight: bold;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* Keeps plenty of breathing room between choices */
            position: relative;
            min-height: 80px;
            width: 100%;
        }

        /* Elegant rounded pill-style buttons */
        button {
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 30px;
            border: none;
        }

        .primary-btn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(229, 56, 59, 0.25);
        }

        .primary-btn:hover {
            transform: scale(1.06);
            background-color: #ff3355;
        }

        #noBtn {
            background-color: white;
            color: #666;
            border: 2px solid #ccc;
            position: relative;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <div id="hearts-container"></div>

    <!-- SCREEN 1: The Intro Page -->
    <div id="intro-screen" class="card">
        <!-- Built-in Love Letter Graphic Vector -->
        <svg class="graphic-container" viewBox="0 0 100 100" xmlns="http://w3.org">
            <rect x="10" y="25" width="80" height="50" rx="5" fill="#ffffff" stroke="#ff4d6d" stroke-width="4"/>
            <path d="M 10 25 L 50 55 L 90 25" fill="none" stroke="#ff4d6d" stroke-width="4" stroke-linejoin="round"/>
            <path d="M 50 48 Q 45 40 50 35 Q 55 40 50 48" fill="#ff4d6d"/>
            <path d="M 50 48 Q 55 40 50 35 Q 45 40 50 48" fill="#ff4d6d"/>
        </svg>
        <h2 class="intro-text">I have a very important question to ask you...</h2>
        <button class="primary-btn" onclick="showQuestion()">Continue ❤️</button>
    </div>

    <!-- SCREEN 2: The Main Proposal Page -->
    <div id="question-screen" class="card hidden">
        <!-- Built-in Cartoon Figure Holding a Big Heart Vector -->
        <svg class="graphic-container" viewBox="0 0 100 100" xmlns="http://w3.org">
            <!-- Cartoon Stick Body -->
            <path d="M 40 65 Q 35 90 43 98 Q 63 98 60 65" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
            <circle cx="48" cy="55" r="2" fill="#333333"/>
            <circle cx="56" cy="55" r="2" fill="#333333"/>
            <!-- Big Pink Heart Being Held -->
            <path d="M 50 50 C 30 30, 30 65, 50 75 C 70 65, 70 30, 50 50" fill="#ff4d6d" stroke="#ff3355" stroke-width="1.5"/>
            <!-- Arms Wrapping Around Heart -->
            <path d="M 38 68 Q 48 65 52 68" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
            <path d="M 62 68 Q 52 65 48 68" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
            <!-- Rosy Cheeks -->
            <circle cx="45" cy="58" r="3" fill="#ffccd5" opacity="0.8"/>
            <circle cx="59" cy="58" r="3" fill="#ffccd5" opacity="0.8"/>
        </svg>
        
        <h1>Will you be my partner? ❤️</h1>
        
        <div class="btn-container">
            <button id="yesBtn" class="primary-btn" onclick="celebrate()">YES</button>
            <button id="noBtn" onmouseover="teleportNo()" onclick="teleportNo()">NO</button>
        </div>
    </div>

    <!-- SCREEN 3: The Success Celebration Page -->
    <div id="success-screen" class="card hidden">
        <!-- Built-in Happy Dancing Cartoon Figure Vector -->
        <svg class="graphic-container" viewBox="0 0 100 100" xmlns="http://w3.org">
            <!-- Happy Body Doodled -->
            <path d="M 40 60 Q 35 85 43 95 Q 63 95 60 60" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
            <!-- Raised Excited Arms -->
            <path d="M 38 65 Q 20 45 25 30" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
            <path d="M 62 65 Q 80 45 75 30" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
            <!-- Happy Blushing Cheeks -->
            <circle cx="44" cy="52" r="4" fill="#ffccd5" opacity="0.9"/>
            <circle cx="56" cy="52" r="4" fill="#ffccd5" opacity="0.9"/>
            <!-- Eyes & Wide Open Smile -->
            <circle cx="46" cy="46" r="2" fill="#333333"/>
            <circle cx="54" cy="46" r="2" fill="#333333"/>
            <path d="M 47 51 Q 50 55 53 51" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Sparkles/Mini Hearts Above -->
            <path d="M 30 20 C 25 10, 25 25, 30 28 C 35 25, 35 10, 30 20" fill="#ff4d6d"/>
            <path d="M 70 20 C 65 10, 65 25, 70 28 C 75 25, 75 10, 70 20" fill="#ff4d6d"/>
        </svg>
        <h1 style="font-size: 2.3rem; line-height: 1.4; margin-bottom: 0;">Yay!<br>Best decision ever 🥰💖</h1>
    </div>

    <script>
        // Generate falling background hearts automatically
        const container = document.getElementById('hearts-container');
        for (let i = 0; i < 30; i++) {
            let heart = document.createElement('div');
            heart.classList.add('heart-fall');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.4;
            container.appendChild(heart);
        }

        // Move from Intro Screen to Question Screen
        function showQuestion() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
        }

        // Keep track of how many times the NO button moves
        let moveCount = 0;

        function teleportNo() {
            const noBtn = document.getElementById('noBtn');
            moveCount++;

            // Hide the NO button after it has run away exactly 4 times
            if (moveCount > 4) {
                noBtn.style.display = 'none';
                return;
            }

            noBtn.style.position = 'absolute'; 
            
            const x = Math.floor(Math.random() * (window.innerWidth - 140));
            const y = Math.floor(Math.random() * (window.innerHeight - 60));
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // Move to the final celebration screen
        function celebrate() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I have a question...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            /* Aesthetic soft peach/orange gradient from your TikTok picture */
            background: linear-gradient(135deg, #ffb3a7 0%, #ffdfba 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Falling Soft Red Hearts Effect */
        .heart-fall {
            position: absolute;
            color: #ff4d6d;
            opacity: 0.6;
            font-size: 20px;
            animation: fall linear infinite;
            pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .card {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.7); /* Clean soft frosted glass look */
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 85%;
        }

        /* Intro Screen Elegant Heading Text */
        .intro-text {
            color: white;
            font-size: 2.3rem;
            line-height: 1.4;
            margin-bottom: 40px;
            text-shadow: 1px 1px 10px rgba(0, 0, 0, 0.15);
            font-weight: normal;
        }

        /* Fixed Cute GIF Sticker Styling */
        .flork-gif {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 25px;
            border-radius: 20px;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            position: relative;
            min-height: 80px;
            width: 100%;
        }

        /* Button Framework */
        button {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Elegant rounded pill-shape for Continue & YES */
        .primary-btn {
            border: none;
            background-color: white;
            color: #ff4d6d;
            border-radius: 30px;
            padding: 15px 50px;
            font-size: 1.3rem;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.2);
        }

        .primary-btn:hover {
            transform: scale(1.06);
            background-color: #fff0f3;
        }

        #noBtn {
            background-color: rgba(255, 255, 255, 0.5);
            color: #666;
            border: 2px solid #ccc;
            border-radius: 30px;
            position: relative;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <div id="hearts-container"></div>

    <!-- SCREEN 1: The Intro Page (Matches your orange screen) -->
    <div id="intro-screen" class="card" style="background: transparent; box-shadow: none; backdrop-filter: none;">
        <h2 class="intro-text">I have a very important question to ask you...</h2>
        <button class="primary-btn" onclick="showQuestion()">Continue ❤️</button>
    </div>

    <!-- SCREEN 2: The Main Proposal Page -->
    <div id="question-screen" class="card hidden">
        <!-- Cute Flork Sticker Shy/Holding Heart -->
        <img class="flork-gif" src="https://tenor.com" alt="Cute Flork Character">
        
        <h1>Will you be my partner? ❤️</h1>
        
        <div class="btn-container">
            <button id="yesBtn" class="primary-btn" onclick="celebrate()">YES</button>
            <button id="noBtn" onmouseover="teleportNo()" onclick="teleportNo()">NO</button>
        </div>
    </div>

    <!-- SCREEN 3: The Success Message Page -->
    <div id="success-screen" class="card hidden">
        <!-- Cute Happy Dancing Flork Sticker -->
        <img class="flork-gif" src="https://tenor.com" alt="Happy Flork Character">
        <h1 style="font-size: 2.2rem; line-height: 1.4;">Yay! Best decision ever 🥰💖🎉</h1>
    </div>

    <script>
        // Generate falling background hearts automatically
        const container = document.getElementById('hearts-container');
        for (let i = 0; i < 30; i++) {
            let heart = document.createElement('div');
            heart.classList.add('heart-fall');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.opacity = Math.random() * 0.6 + 0.4;
            container.appendChild(heart);
        }

        // Move from Intro Screen to Question Screen
        function showQuestion() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
        }

        // Keep track of how many times the NO button moves
        let moveCount = 0;

        function teleportNo() {
            const noBtn = document.getElementById('noBtn');
            moveCount++;

            // If it has run away 3 times, hide it on the 4th attempt
            if (moveCount > 3) {
                noBtn.style.display = 'none';
                return;
            }

            noBtn.style.position = 'absolute'; 
            
            const x = Math.floor(Math.random() * (window.innerWidth - 140));
            const y = Math.floor(Math.random() * (window.innerHeight - 60));
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // Move to the final celebration screen
        function celebrate() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>

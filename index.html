<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I have a question...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            /* Gorgeous soft peach-to-pink gradient background */
            background: linear-gradient(135deg, #ffccd5 0%, #ffdfba 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Falling Soft Red Hearts Background Effect */
        .heart-fall {
            position: absolute;
            color: #ff4d6d;
            opacity: 0.6;
            font-size: 22px;
            animation: fall linear infinite;
            pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .card {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.75); /* Clean frosted glass design card */
            padding: 45px 35px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 85%;
        }

        /* Text Emoji Graphic Scaling */
        .emoji-graphic {
            font-size: 5.5rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Intro Screen Bold Text Style */
        .intro-text {
            color: #ff4d6d;
            font-size: 2.3rem;
            line-height: 1.4;
            margin-bottom: 40px;
            font-weight: normal;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.1rem;
            margin-top: 0;
            margin-bottom: 35px;
            font-weight: bold;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* Keeps plenty of breathing room between choices */
            position: relative;
            min-height: 80px;
            width: 100%;
        }

        /* Elegant rounded pill button styling */
        button {
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 30px;
            border: none;
        }

        .primary-btn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(229, 56, 59, 0.25);
        }

        .primary-btn:hover {
            transform: scale(1.06);
            background-color: #ff3355;
        }

        #noBtn {
            background-color: white;
            color: #666;
            border: 2px solid #ccc;
            position: relative;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <div id="hearts-container"></div>

    <!-- SCREEN 1: The Intro Page -->
    <div id="intro-screen" class="card">
        <span class="emoji-graphic">💌</span>
        <h2 class="intro-text">I have a very important question to ask you...</h2>
        <button class="primary-btn" onclick="showQuestion()">Continue ❤️</button>
    </div>

    <!-- SCREEN 2: The Main Proposal Page -->
    <div id="question-screen" class="card hidden">
        <!-- Cute Shy Teddy Bear Emoji -->
        <span class="emoji-graphic">🧸</span>
        
        <h1>Will you be my partner? ❤️</h1>
        
        <div class="btn-container">
            <button id="yesBtn" class="primary-btn" onclick="celebrate()">YES</button>
            <button id="noBtn" onmouseover="teleportNo()" onclick="teleportNo()">NO</button>
        </div>
    </div>

    <!-- SCREEN 3: The Success Celebration Page -->
    <div id="success-screen" class="card hidden">
        <!-- Happy Dancing Celebration Emojis -->
        <span class="emoji-graphic" style="font-size: 6rem;">💝💃🎉</span>
        <h1 style="font-size: 2.3rem; line-height: 1.4; margin-bottom: 0;">Yay!<br>Best decision ever 🥰💖</h1>
    </div>

    <script>
        // Generate falling background hearts automatically
        const container = document.getElementById('hearts-container');
        for (let i = 0; i < 30; i++) {
            let heart = document.createElement('div');
            heart.classList.add('heart-fall');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.4;
            container.appendChild(heart);
        }

        // Move from Intro Screen to Question Screen
        function showQuestion() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
        }

        // Keep track of how many times the NO button moves
        let moveCount = 0;

        function teleportNo() {
            const noBtn = document.getElementById('noBtn');
            moveCount++;

            // Hide the NO button after it has run away 3 times
            if (moveCount > 3) {
                noBtn.style.display = 'none';
                return;
            }

            noBtn.style.position = 'absolute'; 
            
            const x = Math.floor(Math.random() * (window.innerWidth - 140));
            const y = Math.floor(Math.random() * (window.innerHeight - 60));
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // Move to the final celebration screen
        function celebrate() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>

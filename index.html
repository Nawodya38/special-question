<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I have a question...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Georgia', serif;
            background-color: #ffccd5; /* Soft pastel pink background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Falling Hearts Background Effect */
        .heart-fall {
            position: absolute;
            color: #ff4d6d;
            opacity: 0.7;
            font-size: 22px;
            animation: fall linear infinite;
            pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .card {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.6); /* Soft white card glass */
            padding: 45px 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(229, 56, 59, 0.1);
            backdrop-filter: blur(10px);
            max-width: 420px;
            width: 90%;
            transition: all 0.3s ease;
        }

        /* Intro Screen Big Text Style */
        .intro-text {
            color: #ff4d6d;
            font-size: 2.5rem;
            font-family: 'Georgia', serif;
            line-height: 1.4;
            margin-bottom: 40px;
            font-weight: normal;
        }

        /* Flork Sticker Image Styling */
        .flork-img {
            width: 200px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            position: relative;
            min-height: 80px;
            width: 100%;
        }

        /* Button Styling */
        button {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Comic Sans MS', sans-serif;
            border: 3px dashed #ff4d6d;
            border-radius: 20px;
            background-color: white;
            color: #ff4d6d;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Large custom style for the Continue button */
        .continue-btn {
            border: none;
            background-color: #ff4d6d;
            color: white;
            border-radius: 30px;
            padding: 15px 50px;
            font-size: 1.3rem;
            font-family: 'Georgia', serif;
            box-shadow: 0 4px 15px rgba(229, 56, 59, 0.3);
        }

        button:hover {
            transform: scale(1.06);
        }

        #yesBtn:hover {
            background-color: #fff0f3;
        }

        #noBtn {
            background-color: white;
            color: #666;
            border-color: #999;
            position: relative;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <div id="hearts-container"></div>

    <!-- SCREEN 1: The Intro Page (Like the TikTok Photo) -->
    <div id="intro-screen" class="card">
        <h2 class="intro-text">I have a very important question to ask you...</h2>
        <button class="continue-btn" onclick="showQuestion()">Continue ❤️</button>
    </div>

    <!-- SCREEN 2: The Main Proposal Page (Hidden at first) -->
    <div id="question-screen" class="card hidden">
        <!-- Cute Flork Sticker Holding a Heart -->
        <img class="flork-img" src="https://giphy.com" alt="Cute Flork Character">
        
        <h1>Will you be my partner? ❤️</h1>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">YES</button>
            <button id="noBtn" onmouseover="teleportNo()" onclick="teleportNo()">NO</button>
        </div>
    </div>

    <!-- SCREEN 3: The Success Message Page -->
    <div id="success-screen" class="card hidden">
        <!-- Cute Happy Dancing Flork Sticker -->
        <img class="flork-img" src="https://giphy.com" alt="Happy Flork Character">
        <h1>Yay! Best decision ever 🥰💖🎉</h1>
    </div>

    <script>
        // Generate falling background hearts
        const container = document.getElementById('hearts-container');
        for (let i = 0; i < 30; i++) {
            let heart = document.createElement('div');
            heart.classList.add('heart-fall');
            heart.innerText = '🌸';
            if(Math.random() > 0.5) {
                heart.innerText = '❤️';
            }
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.opacity = Math.random();
            container.appendChild(heart);
        }

        // Move from Intro Screen to Question Screen
        function showQuestion() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
        }

        // Keep track of how many times the NO button moves
        let moveCount = 0;

        function teleportNo() {
            const noBtn = document.getElementById('noBtn');
            moveCount++;

            // If it has run away 3 times, hide it on the 4th attempt
            if (moveCount > 3) {
                noBtn.style.display = 'none';
                return;
            }

            noBtn.style.position = 'absolute'; 
            
            const x = Math.floor(Math.random() * (window.innerWidth - 140));
            const y = Math.floor(Math.random() * (window.innerHeight - 60));
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // Move to the final celebration screen
        function celebrate() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>

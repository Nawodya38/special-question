<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For 4 years...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 20%, transparent 20%), radial-gradient(#1e293b 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            color: #ffffff;
        }

        .card {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #ffffff;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            height: 60px;
            align-items: center;
        }

        .no-btn {
            background: #334155;
            color: #94a3b8;
            box-shadow: none;
            transition: none; /* Instant movement */
        }

        .hidden {
            display: none;
        }

        /* Success Screen */
        .success-screen {
            background: linear-gradient(135deg, #1e1b4b, #311042);
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .success-screen h1 {
            font-size: 3.5rem;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .success-screen p {
            color: #e2e8f0;
            font-size: 1.4rem;
            max-width: 600px;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <!-- Screen 1: The Intro -->
    <div id="screen1" class="card">
        <h1>We have been amazing friends for 4 years now...</h1>
        <p>But I have a very important question to ask you.</p>
        <button onclick="nextScreen(2)">Continue</button>
    </div>

    <!-- Screen 2: The Question -->
    <div id="screen2" class="card">
        <h1>Will you take a chance and be my boyfriend?</h1>
        <div class="btn-container">
            <button onclick="nextScreen(3)">YES</button>
            <button class="no-btn" id="noButton" onmouseover="handleNoInteraction()" onclick="handleNoInteraction()">No</button>
        </div>
    </div>

    <!-- Screen 3: The Success Page -->
    <div id="screen3" class="success-screen hidden">
        <h1>YES!</h1>
        <p>You just made me the happiest person ever.</p>
        <p style="font-size: 1.1rem; color: #94a3b8; margin-top: 10px;">I am so glad I finally told you. Let's make the next 4 years even better.</p>
        <button onclick="restartMagic()" style="margin-top: 30px; background: #ffffff; color: #1e1b4b; box-shadow: none;">See it again</button>
    </div>

    <script>
        // Make sure screen 2 and 3 are hidden at the very start
        document.getElementById('screen2').classList.add('hidden');
        document.getElementById('screen3').classList.add('hidden');

        let noCount = 0;

        function nextScreen(screenNum) {
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('screen2').classList.add('hidden');
            document.getElementById('screen3').classList.add('hidden');

            document.getElementById('screen' + screenNum).classList.remove('hidden');
        }

        function restartMagic() {
            noCount = 0;
            const noBtn = document.getElementById('noButton');
            noBtn.style.position = 'static';
            noBtn.style.display = 'inline-block';
            nextScreen(1);
        }

        function handleNoInteraction() {
            const noBtn = document.getElementById('noButton');
            noCount++;

            if (noCount >= 10) {
                // After 10 attempts, hide the No button completely
                noBtn.style.display = 'none';
            } else {
                // Move to a random position on the screen
                const padding = 50;
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - (padding * 2)) + padding;
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - (padding * 2)) + padding;
                
                noBtn.style.position = 'fixed';
                noBtn.style.left = x + 'px';
                noBtn.style.top = y + 'px';
            }
        }
    </script>
</body>
</html>
